  <!-- back page (peeking out top-right), representing multiple source pages -->
  <path d="M40,20 h32 l10,10 v40 h-42 z" fill="#90CAF9" />
  <path d="M72,20 l10,10 h-10 z" fill="#BBDEFB" />

